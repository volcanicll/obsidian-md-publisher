name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify version consistency
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          MIN_APP=$(node -p "require('./manifest.json').minAppVersion")
          VERSIONS_HAS=$(node -p "require('./versions.json')['$PKG_VERSION'] || ''")
          echo "package.json=$PKG_VERSION manifest.json=$MANIFEST_VERSION"
          if [ "$PKG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::package.json ($PKG_VERSION) 与 manifest.json ($MANIFEST_VERSION) 版本不一致"
            exit 1
          fi
          if [ -z "$VERSIONS_HAS" ]; then
            echo "::error::versions.json 缺少 $PKG_VERSION 的映射（应在发布时写入）"
            exit 1
          fi
          if [ "$VERSIONS_HAS" != "$MIN_APP" ]; then
            echo "::warning::versions.json 中 $PKG_VERSION -> $VERSIONS_HAS，与当前 minAppVersion $MIN_APP 不同"
          fi

          # 官网版本号已改为运行时动态读取 manifest.json，HTML 里不得再出现版本号字面量。
          # 正则必须带 v 前缀：不带 v 会命中 GitHub 图标 SVG 的 path 数据（如 7.59.4、2.01.37），
          # 造成 CI 无故变红。
          if grep -nE 'v[0-9]+\.[0-9]+\.[0-9]+' site/index.html; then
            echo "::error::site/index.html 中出现版本号字面量（官网已动态读取 manifest.json，不应硬编码）"
            exit 1
          fi
          echo "site/index.html 无版本号字面量 ✓"

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build
